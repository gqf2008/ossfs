[package]
name = "ossfs-tray"
version = "0.4.6"
edition = "2024"
description = "Windows system-tray manager for OSSFS (Slint 1.17 UI)"
license = "MIT"
publish = false

[dependencies]
slint = { version = "1.17", default-features = false, features = [
    "unstable-winit-030",
    "std",
    "backend-default",
    "renderer-femtovg",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# 版本更新检查(issue #87):GET GitHub Releases API(后台线程,不阻塞 UI)。
ureq = { version = "2", features = ["json"] }
dirs = { workspace = true }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Credentials go to the OS secure store (Credential Manager / Keychain).
# The two native features are no-ops outside their platform; on Linux the
# crate is compiled but unused (see src/secrets.rs `system_store`).
keyring = { version = "3.6.2", default-features = false, features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"
