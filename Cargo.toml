[package]
name = "ossfs"
version = "0.4.6"
edition = "2024"
authors = ["rk8s-dev team"]
description = "Mount an S3-compatible bucket (Aliyun OSS, MinIO, ...) as a local network drive with no local metadata database"
repository = "https://github.com/gqf2008/ossfs"
license = "MIT"

[workspace]
members = [
    "desktop",
]

default-members = ["."]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.100"
aws-config = "1.8.8"
aws-smithy-runtime-api = "1.11.4"
aws-smithy-types = "1.4.4"
aws-sdk-s3 = "1.108.0"
dirs = "6.0.0"
libc = "0.2.175"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
winfsp = { version = "0.12.2", default-features = false }

[dependencies]
anyhow = { workspace = true }
aws-config = { workspace = true, features = ["credentials-process"] }
aws-sdk-s3 = { workspace = true, features = ["behavior-version-latest"] }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
chrono = "0.4.42"
base64 = "0.22"
md-5 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "time", "net", "signal", "tracing"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
[features]
default = ["fuse"]
fuse = ["dep:fuser"]
fuse-winfsp = []

[dev-dependencies]
serial_test = "3.2.0"
tempfile = "3.20.0"

[profile.release]
debug = true
strip = false

[target.'cfg(windows)'.dependencies]
winfsp = { workspace = true, features = ["delayload", "async-io", "notify"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { workspace = true, features = ["delayload"] }

[target.'cfg(not(windows))'.dependencies]
# Optional so `--no-default-features` builds the metadata-store core without
# the FUSE adapter (CI macOS runners have no pkg-config fuse library).
fuser = { version = "0.17", features = ["fuse-t"], optional = true }
libc = { workspace = true }

# Patch fuser: add a `fuse-t` feature so the macOS FUSE ABI layout matches
# FUSE-T's NFS backend (standard libfuse3 attr layout) instead of macFUSE's
# extended layout. See vendor/fuser/README-vendor.md.
[patch.crates-io]
fuser = { path = "vendor/fuser" }
